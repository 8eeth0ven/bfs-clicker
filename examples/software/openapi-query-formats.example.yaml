openapi: 3.1.1
info: {title: Query Formats, version: '1'}
servers: [{url: 'https://api.example.test'}]
paths:
  /items:
    get:
      parameters:
        - in: query
          name: tags
          required: true
          style: form
          explode: false
          schema: {type: array, minItems: 1, maxItems: 10, items: {type: string}}
        - in: query
          name: filter
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              state: {type: string, enum: [open, closed]}
              minScore: {type: integer, minimum: 0}
            additionalProperties: false
        - in: query
          name: fields
          style: pipeDelimited
          explode: false
          schema: {type: array, maxItems: 5, items: {type: string, enum: [name, score, state]}}
      responses:
        '200': {description: Results}

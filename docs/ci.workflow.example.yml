name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Web, gateway, software and Python
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      PYTHONPATH: apk_tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apk_tools/pyproject.toml
            apk_tools/requirements-static.lock
      - name: Install OCR and native fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang lld tesseract-ocr tesseract-ocr-eng fonts-liberation
      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix gateway ci
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r apk_tools/requirements-static.lock -e ./apk_tools
      - name: Install Chromium and browser system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build gateway
        run: npm run gateway:build
      - name: Test Web, MCP and gateway
        run: npm test
      - name: Test software adapters and visual guards
        run: npm run test:software
      - name: Test Python inventory and mocked mobile protocols
        run: npm run test:python

  macos-vision:
    name: Apple Vision and image coordinates
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json
      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix gateway ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build gateway
        run: npm run gateway:build
      - name: Test real Vision OCR, regions and Chinese MCP workflow
        run: >-
          node --test --test-concurrency=1
          test/visual-vision.test.mjs
          test/visual-vision-regions.test.mjs
          test/visual-observation-regions.test.mjs
          test/software-visual-chinese.test.mjs

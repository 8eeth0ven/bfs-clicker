<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="APK → 接口清单 → MCP">
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#f5faff"/>
      <stop offset="1" stop-color="#ffffff"/>

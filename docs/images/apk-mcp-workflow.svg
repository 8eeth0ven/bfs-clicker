    <text x="64" y="94" font-size="48" font-weight="700" fill="#102747" text-anchor="start">APK → 接口清单 → MCP</text>
    <text x="64" y="144" font-size="24" font-weight="400" fill="#526780" text-anchor="start">从安装包线索到运行时证据，再到受控的结构化工具调用</text>

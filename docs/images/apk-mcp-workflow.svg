    <text x="90" y="500" font-size="19" font-weight="400" fill="#526780" text-anchor="start">类 / 资源位置保留</text>
    <path d="M340 388 L358 388" fill="none" stroke="#008c91" stroke-width="3" marker-end="url(#arrow)"/>

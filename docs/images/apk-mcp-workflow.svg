    <text x="1290" y="464" font-size="22" font-weight="400" fill="#526780" text-anchor="start">add_source · 资源</text>
    <text x="1290" y="500" font-size="19" font-weight="400" fill="#526780" text-anchor="start">Claude / Cursor</text>
    <rect x="64" y="599" width="464" height="160" rx="20" fill="#f7faff" stroke="#d8e5f2"/>
    <rect x="88" y="626" width="5" height="28" rx="2" fill="#008c91"/>
    <text x="108" y="649" font-size="26" font-weight="700" fill="#102747" text-anchor="start">凭据在本地绑定</text>
    <text x="88" y="692" font-size="21" font-weight="400" fill="#526780" text-anchor="start">headers / Cookie / token</text>
    <text x="88" y="727" font-size="21" font-weight="400" fill="#526780" text-anchor="start">storageState · 响应脱敏</text>
    <rect x="568" y="599" width="464" height="160" rx="20" fill="#f7faff" stroke="#d8e5f2"/>
    <rect x="592" y="626" width="5" height="28" rx="2" fill="#3269cf"/>
    <text x="612" y="649" font-size="26" font-weight="700" fill="#102747" text-anchor="start">调用有护栏</text>
    <text x="592" y="692" font-size="21" font-weight="400" fill="#526780" text-anchor="start">GET-only beta · Origin 校验</text>
    <text x="592" y="727" font-size="21" font-weight="400" fill="#526780" text-anchor="start">超时 · 一次重试 · 32 KiB 默认截断</text>
    <rect x="1072" y="599" width="464" height="160" rx="20" fill="#f7faff" stroke="#d8e5f2"/>
    <rect x="1096" y="626" width="5" height="28" rx="2" fill="#6554c0"/>
    <text x="1116" y="649" font-size="26" font-weight="700" fill="#102747" text-anchor="start">证据与健康状态分开</text>
    <text x="1096" y="692" font-size="21" font-weight="400" fill="#526780" text-anchor="start">static_candidate = 静态未验证</text>
    <text x="1096" y="727" font-size="21" font-weight="400" fill="#526780" text-anchor="start">observed = 网络层实抓</text>
    <path d="M64 812H1536" stroke="#d8e5f2"/>
    <text x="64" y="852" font-size="20" font-weight="400" fill="#526780" text-anchor="start">静态原单保留；验证生成派生清单，网关学习写入旁车文件。</text>
    <text x="1536" y="852" font-size="18" font-weight="400" fill="#526780" text-anchor="end">功能示意 · 非产品截图</text>
